<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Validador de CUIT / CUIL</title>
    <link rel="stylesheet" href="style16.css">
</head>

<body>
    <main class="card">
        <h1>Validador de CUIT / CUIL</h1>
        <p class="subtitulo">Ingrese el número con o sin guiones.</p>

        <div class="campo">
            <label for="cuit">Número:</label>
            <input type="text" id="cuit" placeholder="20-12345678-6" maxlength="13">
            <button id="btnValidar">Validar</button>
        </div>

        <div id="resultado" class="resultado"></div>

    </main>

    <script src="script.js"></script>
</body>

</html>
